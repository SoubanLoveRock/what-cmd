[package]
name = "whatcmd"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
serde ={ version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
thiserror = "=2.0.21"
toml = "=1.1.8"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std"] }
ureq = { version = "=3.5.1", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
tempfile = "=3.27.0"
